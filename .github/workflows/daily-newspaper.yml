name: Daily Morning Sunshine

on:
  schedule:
    # 7:00 AM UTC every day
    - cron: '0 7 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/happy-news-newspaper-t8qgg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's newspaper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name  "Morning Sunshine Bot"
          git config user.email "morning-sunshine@github-actions.bot"
          git add index.html
          # Only commit if index.html actually changed
          git diff --staged --quiet || git commit -m "$(printf '\xf0\x9f\x8c\x85 Daily newspaper: %s' "$(date +'%B %d, %Y')")"
          git push origin claude/happy-news-newspaper-t8qgg
